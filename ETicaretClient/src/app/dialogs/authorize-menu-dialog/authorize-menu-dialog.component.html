<h2 matBadge="{{rolesComponent.selectedOptions.selected.length}}/{{datas?.totalRoleCount}}" matBadgeOverlap="false"
    mat-dialog-title>{{data["name"]}} Endpoint'ine Rol Atama</h2>
<div mat-dialog-content>
    <!-- <p>Rol atamak istediğinize emin misiniz?</p> -->
    <p>İlgili sayfaya aşağıdan rolleri atayabilirsiniz</p>
</div>

<mat-selection-list #rolesComponent>
    <mat-list-option *ngFor="let role of roles" [selected]="isSelected(role.name)" >
        {{role.name}}
    </mat-list-option>
</mat-selection-list>

<div mat-dialog-actions>
    <button mat-button (click)="close()">İptal</button>
    <button mat-button [mat-dialog-close]="data" cdkFocusInitial (click)="assignRoles(rolesComponent)">Rolleri
        Ata</button>
</div>
