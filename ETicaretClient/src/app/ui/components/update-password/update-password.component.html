<div class="row" style="margin-top:1rem;" *ngIf="state.state">
    <div class="col-md-3"></div>
    <div class="col-md-6">
        <div class="mb-3">
            <label for="password" class="form-label">Şifre</label>
            <input type="password" class="form-control" id="password" placeholder="Şifre" #txtPassword>
            <label for="passwordConfirm" class="form-label">Şifre Tekrar</label>
            <input type="password" class="form-control" id="passwordConfirm" placeholder="Şifre Tekrar"
                #txtPasswordConfirm>
            <button type="button" (click)="updatePassword(txtPassword.value,txtPasswordConfirm.value)" style="margin-top: 1rem; float:right;" class="btn btn-primary">Şifreyi Güncelle</button>
        </div>
    </div>
    <div class="col-md-3"></div>
</div>

<div class="alert alert-danger" role="alert" *ngIf="!state.state">
    Bu link kullanılmamaktadır
</div>
